# Fly.io: install flyctl, then run `fly launch --copy-config` and `fly deploy` in this folder.
# Rooms live in memory, so keep a single machine running (min_machines_running = 1).
app = "vinyl"
primary_region = "bom"

[build]

[env]
  VINYL_CLOUD = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
