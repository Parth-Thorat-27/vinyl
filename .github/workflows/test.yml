name: Tests

# Runs the whole test suite (server API, player, rooms, voice chat) on every push and pull request.
# The browser tests use the Chrome that GitHub's Ubuntu machines come with, plus a stand-in for
# YouTube, so they don't depend on YouTube being reachable from GitHub's servers.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
